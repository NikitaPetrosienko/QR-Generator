services:
  # Раздел со списком сервисов (каждый сервис = один контейнер)
  qr-api:
    # Имя сервиса
    build: .
    # Собрать образ из Dockerfile в текущей папке (.)
    container_name: nestro_qr
    # Явно задаём имя контейнера 
    ports:
      - "8000:8000"
      # Проброс порта: <порт_хоста>:<порт_в_контейнере>. внешний:внутренний
      # Открываешь http://localhost:8000 → попадаешь на 8000 внутри контейнера.

    # монтируем внешний конфиг внутрь контейнера
    volumes:
      - ./config/qr_config.json:/app/config.json:ro
      # Левее ":" — путь на хосте (твой файл в репозитории),
      # правее ":" — путь внутри контейнера (/app/config.json),
      # :ro — монтируем только для чтения (контейнер не сможет его изменять).
      # Твоя app читает конфиг по умолчанию из "config.json" в рабочей директории,
      # а рабочая директория у нас /app → значит путь /app/config.json — корректный.

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      # Команда, которой Docker проверяет "здоровье" контейнера:
      # curl -fsS (тихий режим, ошибка по не-2xx) на эндпоинт /healthz
      interval: 10s # подумать о параметрах
      # Как часто проверять (каждые 10 секунд)
      timeout: 2s
      # Сколько ждать ответа от команды (2 секунды)
      retries: 5
      # Сколько подряд неуспешных проверок считать фатальными (после 5 — unhealthy)

    restart: unless-stopped # после 5 перезапусков stoped
    # Политика рестартов:
    # перезапускать контейнер, пока ты его сам явно не остановишь (docker stop)
