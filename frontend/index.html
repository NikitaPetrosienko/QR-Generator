<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Генератор QR-кодов</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page-container">
    <!-- Заголовок -->
    <header class="corp-header">
      <h1 class="corp-title">ГЕНЕРАТОР QR-КОДОВ</h1>
    </header>

    <!-- Контент -->
    <section class="content">
      <div class="form-section">
        <div class="tab-row">
          <button class="tab active" data-type="url">Ссылка</button>
          <button class="tab" data-type="phone">Телефон</button>
          <button class="tab" data-type="mail">E-mail</button>
          <button class="tab" data-type="sms">SMS</button>
          <button class="tab" data-type="vcard">Визитка</button>
        </div>

        <div id="formFields"></div>

        <details class="style-block">
          <summary>Настроить внешний вид</summary>
          <div class="style-grid">
            <label>Цвет QR:</label>
            <div class="color-input">
              <input type="color" id="fillColor" value="#000000" />
              <span class="color-preview" id="fillPreview"></span>
            </div>

            <label>Цвет ключей:</label>
            <div class="color-input">
              <input type="color" id="finderColor" value="#000000" />
              <span class="color-preview" id="finderPreview"></span>
            </div>

            <label>Фон:</label>
            <div class="color-input">
              <input type="color" id="bgColor" value="#FFFFFF" />
              <span class="color-preview" id="bgPreview"></span>
            </div>
          </div>
        </details>

        <button id="generateBtn">Сгенерировать</button>
      </div>

      <aside class="result-section">
        <h2>Результат</h2>
        <div id="qrResult" class="qr-container">
          <p class="placeholder">QR появится здесь</p>
        </div>
        <button id="downloadBtn" class="download-btn" disabled>Скачать QR</button>
      </aside>
    </section>
  </main>
  

  <script src="script.js"></script>
</body>
</html>
